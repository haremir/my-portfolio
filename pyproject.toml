[project]
name = "harun-site"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.2.0",
    "httpx>=0.27.0",
    "markdown>=3.10.2",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=21.0",
    "python-frontmatter>=1.1.0",
    "reflex[db]>=0.9.2.post1",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
]

[project.scripts]
site = "harun_site.dev_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harun_site"]
